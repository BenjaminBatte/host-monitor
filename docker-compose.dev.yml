version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: host-monitor-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-2020}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: yourrepo/host-monitor-backend:TAG
    environment:
      DB_URL: ${DB_URL:-postgres://${DB_USER:-postgres}:${DB_PASS:-2020}@postgres:5432/${DB_NAME:-postgres}?sslmode=disable}
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      # ensure curl exists in the image, or change to a TCP check
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  ui:
    image: yourrepo/host-monitor-ui:TAG
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:9090}
    ports:
      - "4200:4200"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
